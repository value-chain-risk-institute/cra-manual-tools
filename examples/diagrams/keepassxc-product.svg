rface</text><text x="16" y="474" font-size="11.5" fill="#16212b">2.1.2 Product diagram. The product’s main components and the interfaces through which it is reached. Everything inside the dashed line is the manufacturer’s</text><text x="16" y="489" font-size="11.5" fill="#16212b">responsibility.</text><text x="984" y="508" text-anchor="end" font-size="9" fill="#b3ae9d">Drawn from the same lists as the tables · Cyber Manual template v0.39 structure · Value Chain Risk Institute · Method: the Derivation Rule, Marpet &amp; Viktor 2026 · CC BY 4.0</text></svg>