 <tspan font-family="ui-monospace,Menlo,monospace" font-weight="700">SP03</tspan> Backup before update</text></g><g data-drag="PC05"><rect x="38" y="364" width="150" height="60" rx="5" fill="#e7f3ec" stroke="#2f7d5b" stroke-width="1.2"/><text x="47" y="378" font-size="9.5" font-weight="700" fill="#2f7d5b" font-family="ui-monospace,Menlo,monospace">PC05</text><text x="47" y="391" font-size="11.5" fill="#16212b">Optional CR2032</text><text x="47" y="404" font-size="11.5" fill="#16212b">battery (not</text><text x="47" y="417" font-size="11.5" fill="#16212b">included)</text></g><g data-drag="PI01"><rect x="256" y="70" width="110" height="47" rx="5" fill="#eef7f2" stroke="#2f7d5b" stroke-width="1.2"/><text x="265" y="84" font-size="9.5" font-weight="700" fill="#2f7d5b" font-family="ui-monospace,Menlo,monospace">PI01</text><text x="265" y="97" font-size="11.5" fill="#16212b">Gigabit</text><text x="265" y="110" font-size="11.5" fill="#16212b">Ethernet</text><text x="360" y="84" text-anchor="end" font-size="9" fill="#5b6b78">PI</text></g><g data-drag="PI02"><rect x="256" y="129" width="110" height="47" rx="5" fill="#eef7f2" stroke="#2f7d5b" stroke-width="1.2"/><text x="265" y="143" font-size="9.5" font-weight="700" fill="#2f7d5b" font-family="ui-monospace,Menlo,monospace">PI02</text><text x="265" y="156" font-size="11.5" fill="#16212b">2x USB 2.0</text><text x="265" y="169" font-size="11.5" fill="#16212b">Type-A</text><text x="360" y="143" text-anchor="end" font-size="9" fill="#5b6b78">PI</text></g><g data-drag="PI03"><rect x="256" y="188" width="110" height="60" rx="5" fill="#eef7f2" stroke="#2f7d5b" stroke-width="1.2"/><text x="265" y="202" font-size="9.5" font-weight="700" fill="#2f7d5b" font-family="ui-monospace,Menlo,monospace">PI03</text><text x="265" y="215" font-size="11.5" fill="#16212b">HDMI</text><text x="265" y="228" font-size="11.5" fill="#16212b">(diagnostics</text><text x="265" y="241" font-size="11.5" fill="#16212b">only)</text><text x="360" y="202" text-anc