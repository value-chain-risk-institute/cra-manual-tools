<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" width="1000" height="591" role="img" aria-label="2.2.1 Security property diagram: product components and interfaces inside the product boundary; context components and persons outside, attached to the interfaces they touch; security properties and conditions of use as badges; function and risk paths as numbered steps." font-family="system-ui,Helvetica,Arial,sans-serif" font-size="11"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7a86"/></marker></defs><rect x="0" y="0" width="1000" height="591" fill="#fcfcf9"/><text x="16" y="22" font-size="12" font-weight="600" fill="#16212b">2.2.1 Security property diagram</text><rect x="24" y="42" width="356" height="420" rx="8" fill="none" stroke="#2f7d5b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="34" y="36" fill="#2f7d5b" font-size="10.5" letter-spacing=".3">Home Assistant Green NC-GREEN-9703 · product boundary</text><text x="36" y="449" font-size="9.5" fill="#2f7d5b">◆ <tspan font-family="ui-monospace,Menlo,monospace" font-weight="700">SP02</tspan> No onboard radios</text><line x1="188" y1="87" x2="256" y2="87" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="87" x2="256" y2="146" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="205" x2="256" y2="87" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="205" x2="256" y2="277" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="266" x2="256" y2="87" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="266" x2="256" y2="146" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="266" x2="256" y2="205" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><line x1="188" y1="266" x2="256" y2="277" stroke="#2f7d5b" stroke-width="1" opacity=".35"/><g data-drag="PC01"><rect x="38" y="70" width="150" height="60" rx=