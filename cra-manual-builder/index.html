<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRA Manual Builder — VCRI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --doc:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --bg:#eaeef1; --panel:#ffffff; --paper:#fcfcf9;
  --ink:#16212b; --muted:#5b6b78; --line:#d7dee3; --line2:#e8edf0;
  --accent:#0b6b80; --accent-ink:#ffffff; --accent-soft:#e2f0f3;
  --mfr:#2f7d5b; --mfr-soft:#e7f3ec; --usr:#a9660f; --usr-soft:#f6ecdc;
  --field:#f6f8f9; --shadow:0 1px 2px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d141a; --panel:#141d25; --paper:#f5f3ed;
  --ink:#e7eef3; --muted:#93a3af; --line:#26333f; --line2:#1c2731;
  --accent:#34b3cb; --accent-ink:#06222a; --accent-soft:#123039;
  --mfr:#54c191; --mfr-soft:#12291f; --usr:#d69a4a; --usr-soft:#2c2211;
  --field:#0f1820; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="light"]{
  --bg:#eaeef1; --panel:#ffffff; --paper:#fcfcf9;
  --ink:#16212b; --muted:#5b6b78; --line:#d7dee3; --line2:#e8edf0;
  --accent:#0b6b80; --accent-ink:#ffffff; --accent-soft:#e2f0f3;
  --mfr:#2f7d5b; --mfr-soft:#e7f3ec; --usr:#a9660f; --usr-soft:#f6ecdc;
  --field:#f6f8f9; --shadow:0 1px 2px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.06);
}
:root[data-theme="dark"]{
  --bg:#0d141a; --panel:#141d25; --paper:#f5f3ed;
  --ink:#e7eef3; --muted:#93a3af; --line:#26333f; --line2:#1c2731;
  --accent:#34b3cb; --accent-ink:#06222a; --accent-soft:#123039;
  --mfr:#54c191; --mfr-soft:#12291f; --usr:#d69a4a; --usr-soft:#2c2211;
  --field:#0f1820; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}

/* ---- top bar ---- */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.mark svg{width:18px;height:18px}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.btn{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn svg{width:15px;height:15px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---- layout ---- */
main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.15fr);gap:0;height:calc(100vh - 53px)}
.pane{overflow-y:auto;height:100%}
.edit{padding:16px 16px 80px;border-right:1px solid var(--line)}
.preview{background:var(--bg);padding:22px 22px 80px}
.tabbar{display:none}

.note{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.credit{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:12px;line-height:1.5}
.credit strong{color:var(--accent)}

/* ---- accordion sections ---- */
.sec{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .chev{margin-left:auto;transition:transform .15s;color:var(--muted)}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec>summary .ix{font:600 11px/1 var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:4px 6px;min-width:26px;text-align:center}
.body{padding:4px 14px 16px;display:flex;flex-direction:column;gap:11px}
.guide{background:var(--field);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;padding:8px 10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.guide b{color:var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.3px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{background:var(--field);border:none;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f{display:flex;flex-direction:column}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
textarea{resize:vertical;min-height:52px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* repeatable rows */
.rows{display:flex;flex-direction:column;gap:9px}
.row{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--field);position:relative}
.row.pxx{border-left:3px solid var(--mfr)}
.row.cuxx{border-left:3px solid var(--usr)}
.row .rm{position:absolute;top:7px;right:7px;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;line-height:0}
.row .rm:hover{color:#c0392b}
.row .rid{font:600 11px/1 var(--mono);color:var(--muted);margin-bottom:7px;display:inline-block}
.add{align-self:flex-start;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.add:hover{border-color:var(--accent);color:var(--accent)}
.body select{width:100%;background:var(--field);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--accent);cursor:pointer}
.body select:hover{border-color:var(--accent)}
.tag{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.tag.mfr{background:var(--mfr-soft);color:var(--mfr)}
.tag.usr{background:var(--usr-soft);color:var(--usr)}
.hint{font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--field);border:none;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---- document preview ---- */
.doc{background:var(--paper);color:#1a1a1a;max-width:820px;margin:0 auto;border-radius:6px;box-shadow:var(--shadow);padding:52px 60px;font-family:var(--doc);font-size:14.5px;line-height:1.6}
.doc h1{font-size:30px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.doc .ver{font-family:var(--ui);font-size:11.5px;color:#6a6a6a;letter-spacing:.3px;margin-bottom:22px}
.doc h2{font-size:19px;color:#0b6b80;font-weight:700;margin:30px 0 10px;padding-bottom:5px;border-bottom:1px solid #e6e2d6}
.doc h3{font-size:14.5px;font-weight:700;margin:18px 0 7px;font-family:var(--ui)}
.doc p{margin:0 0 10px}
.doc .intro{color:#3a3a3a}
.doc table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-family:var(--ui);font-size:12.5px}
.doc th,.doc td{border:1px solid #d9d5c8;padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:#f0ede2;font-weight:600}
.doc td.id{font-family:var(--mono);font-weight:600;white-space:nowrap;width:1%}
.doc tr.pxx td.id{color:#2f7d5b}
.doc tr.cuxx td.id{color:#a9660f}
.doc .kv{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:13px;margin-bottom:14px}
.doc .kv td{border:1px solid #d9d5c8;padding:7px 10px}
.doc .kv td:first-child{background:#f5f3ea;font-weight:600;width:38%}
.doc .empty{color:#b3ae9d;font-style:italic}
.doc .refnote{font-family:var(--ui);font-size:11px;color:#7a7768;background:#f5f3ea;border-left:3px solid #0b6b80;padding:7px 10px;margin:6px 0 14px}
.doc .annexref{font:600 10px/1 var(--mono);color:#0b6b80}
.chip{font:600 10px/1 var(--mono);padding:2px 5px;border-radius:4px;background:#eaf4f6;color:#0b6b80;margin-left:5px}
.doc small.watermark{display:block;text-align:center;color:#b3ae9d;font-family:var(--ui);font-size:10.5px;margin-top:34px;border-top:1px solid #e6e2d6;padding-top:12px}

footer{padding:14px 16px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);background:var(--panel);text-align:center}

@media (max-width:880px){
  main{grid-template-columns:1fr;height:auto}
  .tabbar{display:flex;position:sticky;top:53px;z-index:15;background:var(--panel);border-bottom:1px solid var(--line)}
  .tabbar button{flex:1;background:none;border:none;padding:11px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
  .tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .pane{height:auto;overflow:visible}
  .edit{border-right:none}
  body.show-preview .edit{display:none}
  body:not(.show-preview) .preview{display:none}
  .doc{padding:32px 26px}
}
@media print{
  header,.tabbar,.edit,footer,.note{display:none!important}
  main{display:block;height:auto}
  .preview{background:#fff;padding:0}
  .doc{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .doc h2{break-after:avoid}
  table{break-inside:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V7z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <div><b>CRA Manual Builder</b><span>Value Chain Risk Institute · free</span></div>

    <button class="btn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg></button>
  </div>
</header>

<div class="tabbar">
  <button id="tabEdit" class="on">Edit</button>
  <button id="tabPrev">Preview</button>
</div>

<main>
  <section class="pane edit" id="editPane"></section>
  <section class="pane preview"><article class="doc" id="doc"></article></section>
</main>

<footer id="foot"></footer>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const n=document.createElement(t);for(const p in a){if(p==="class")n.className=a[p];else if(p==="html")n.innerHTML=a[p];else n.setAttribute(p,a[p]);}k.flat().forEach(c=>n.append(c));return n;};
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- data model ---------- */
const blank=()=>({
  meta:{version:"0.1",date:""},
  mfr:{name:"",address:"",email:"",website:""},
  vuln:{contact:"",policy:""},
  product:{name:"",tmv:"",additional:"",sub:[]},
  functions:[],
  interfaces:{physical:"",ethernet:[],internet:[]},
  pxx:[], contexts:[], cuxx:[],
  circ:[],
  doc:{link:""},
  support:{type:"",end:""},
  sbom:{access:""},
  life:{commissioning:"",secureUse:"",dataImpact:"",updateInstall:"",disableAuto:"",decommission:"",dataRemoval:"",integrator:""}
});
let M=blank();

/* CRA Annex I Part I requirements (2b–2m) */
const REQ1=[["2b","Secure by default configuration"],["2c","Secure update mechanism"],["2d","Protection from unauthorized access"],["2e","Confidentiality protection"],["2f","Integrity protection"],["2g","Data minimisation"],["2h","Availability protection"],["2i","Minimisation of negative impact on other services"],["2j","Attack surface limitation"],["2k","Impact reduction"],["2l","Recording and monitoring"],["2m","Secure data removal / transfer"]];
const REQ2=[["1","Vulnerability identification & SBOM"],["2","Vulnerability remediation"],["3","Regular tests"],["4","Public vulnerability disclosure"],["5","Coordinated vulnerability disclosure"],["6","Vulnerability contact"],["7","Secure update distribution"],["8","Security update dissemination"]];

let MODE="full"; /* full = B2B detailed manual · light = end-user version */

/* Authoritative CRA guidance per chapter — verbatim citations from the Cyber Manual Movement GUIDANCE doc (v0.20) */
const GUIDE={
 "1":["Annex II (1)","The name, registered trade name or trademark of the manufacturer, plus postal address, an email or other digital contact, and where available the website."],
 "2":["Annex II (2)","The single point of contact where vulnerabilities can be reported, and where the manufacturer's coordinated-vulnerability-disclosure policy can be found."],
 "3":["Annex II (3)","Name, type, and any additional information that uniquely identifies the product. Components are optional but let you reference them throughout the document (e.g. a Digital Product Passport)."],
 "4":["Annex II (4)","The intended purpose = context + functions + conditions of use. Functions are abstract outcomes (\"use cases\"), not features. Note: the \"install security updates\" function is CRA-mandatory (Annex I 2c) — include it for every product, always ancillary. One product has one core functionality (it sets the Annex III/IV conformity regime); everything else is ancillary. Security Properties (Pxx) live inside the product boundary (manufacturer's responsibility); Conditions of Use (CUxx) live in the context (user's responsibility). Both should stem from your risk assessment."],
 "5":["Annex II (5)","Any known or foreseeable circumstance — including reasonably foreseeable misuse — that may lead to significant cybersecurity risk. These are outputs of the risk assessment: typically what the user can trigger by changing the product/context or by being attacked."],
 "6":["Annex II (6)","Where applicable, the internet address for the EU Declaration of Conformity. Link to the most current version for this exact product."],
 "7":["Annex II (7)","The type of technical security support offered, and the end date of the support period during which users can expect vulnerabilities handled and updates provided. The end date may live here or elsewhere (e.g. a product website)."],
 "8":["Annex II (8a–8e, f)","Detailed instructions (or a link to them) for: secure commissioning & lifetime use (8a); how changes affect data security (8b); installing security updates (8c); secure decommissioning & data removal (8d); disabling the automatic-update default (8e); and, where the product is integrated into others, integrator guidance to meet Annex I & document per Annex V (f)."],
 "9":["Annex II (9)","Optional. If you make the SBOM available, information on where it can be accessed. (Note: Annex I Part II still requires you to draw up an SBOM covering at least top-level dependencies in a machine-readable format.)"]
};

/* Vetted example text from the Cyber Manual Movement BOILERPLATE doc (v0.20). Pxx/CUxx carry the CRA refs the boilerplate pre-mapped, so inserting one auto-fills the crosswalk. */
const BOILER={
 functions:[
  {label:"Communicate with other users",title:"Communicate with other users",desc:"",kind:"core"},
  {label:"Access information and services",title:"Access information and services",desc:"",kind:"core"},
  {label:"Run third-party applications",title:"Run third-party applications",desc:"",kind:"ancillary"},
  {label:"Browse the internet",title:"Browse the internet",desc:"",kind:"ancillary"},
  {label:"Program a PLC",title:"Program a PLC",desc:"",kind:"core"},
  {label:"Inform users of unusual events",title:"Inform users of unusual events",desc:"",kind:"ancillary"},
  {label:"Troubleshoot from remote",title:"Troubleshoot from remote",desc:"",kind:"ancillary"},
  {label:"Install security updates (CRA-mandatory)",title:"Install security updates",desc:"New security updates are automatically downloaded from <LINK> and installed after user confirmation.",kind:"ancillary"},
  {label:"Install security updates manually",title:"Install security updates manually",desc:"Security updates can be downloaded from <LINK> and installed manually by the user.",kind:"ancillary"}],
 pxx:[
  {label:"Password protection",title:"Password protection",comp:"",desc:"<Function / component XXX> is password protected. Strong passwords are enforced (password complexity requirements can be set by role “admin”).",refs:"2d,2e"},
  {label:"User notification on file change",title:"User notification in case file changes",comp:"",desc:"Stored <XXX> files are checked regularly and users are notified as soon as a file change occurs that hasn’t been initiated by the user.",refs:"2f"},
  {label:"Malware protection",title:"Malware protection",comp:"",desc:"Component <XXX> uses malware protection.",refs:"2f"},
  {label:"Disable unused USB ports",title:"Disabling of unused USB ports",comp:"",desc:"Any unused USB ports are disabled by default. They can temporarily be enabled e.g. for security updates via USB (see <function XXX>).",refs:"2j"},
  {label:"Tamper-evident shipping seal",title:"Tamper-evident shipping seal",comp:"",desc:"To guarantee supply chain security and product integrity, this device is delivered with a tamper-evident shipping seal, ensuring the product has not been subjected to unauthorized access or modification during transit.",refs:""}],
 cuxx:[
  {label:"Restrict physical access",title:"Restrict physical access",desc:"Only authorized persons should have physical access to the product. Depending on the environment: protect cables from physical access, install in a protected enclosure, and restrict access to the rooms where the product is operated.",refs:"2d,2j"},
  {label:"Trusted environment",title:"Trusted environment",desc:"To ensure safe and reliable operation, the device must exclusively be installed and operated within a fully trusted, secured industrial environment.",refs:"2d"},
  {label:"Protection of the operating environment",title:"Protection of the operating environment",desc:"The operator must ensure unauthorized third parties are prevented from accessing the product’s area of operation by technical or organizational measures, such as access controls on the premises.",refs:"2d,2j"},
  {label:"Network security (risk assessment first)",title:"Network security",desc:"Before connecting the product to a network, the network must undergo a cybersecurity risk assessment and be protected by appropriate measures: segmentation, monitoring, restriction of (remote) access, secure authentication, packet filtering, and malware detection.",refs:"2d"},
  {label:"No local admin accounts",title:"No local admin accounts",desc:"Administrative rights are assigned exclusively through the central identity management system. Only centrally managed and authenticated user accounts are permitted to access <component XXX>.",refs:"2b,2d,2j,2k"},
  {label:"Use of secure passwords",title:"Use of secure passwords",desc:"The operator must ensure appropriately secure passwords are used at all times, and that passwords for access to the product are made available only to authorized persons.",refs:"2d"},
  {label:"Regular integrity checks",title:"Regular integrity checks",desc:"Regular code integrity checks must be performed to ensure only verified, unchanged code is executed. This lies outside the product boundary and must be fulfilled by the operator.",refs:"2f"},
  {label:"Protection of transmission media",title:"Protection of transmission media",desc:"The transmission media used (e.g., ethernet cables) must be protected against access by unauthorized third parties via technical or organizational measures, e.g., access controls or secure cable ducts.",refs:"2d,2e,2f"},
  {label:"Network security for data in transit (legacy protocols)",title:"Network security measures to protect data in transit",desc:"Because this device uses legacy communication protocols (e.g., FOUNDATION Fieldbus, PROFIBUS, HART) which lack native encryption, the facility operator is fully responsible for implementing independent network security measures.",refs:"2e,2f"},
  {label:"No identification of persons",title:"No identification of persons",desc:"The product does not have sufficient capabilities to secure data that could identify persons. Its input field or camera field of view must not be positioned so that identifiable persons are captured.",refs:"2g"},
  {label:"Temporary internet use",title:"Temporary internet use",desc:"The webserver built into the product must be switched off when not in use.",refs:"2j"}],
 circ:[
  {label:"Updates from untrusted source",title:"Download of security updates from untrusted source",ref:"Install security updates manually",misuse:"Software updates must only be downloaded from the manufacturer website <LINK>. The user must verify the URL is correct and use the provided hash to assure the integrity of the update file.",risk:"Security updates from an untrusted source can contain hidden malware. In the worst case such malware may manipulate programs stored on the engineering host, which are then unknowingly pushed to production."}],
 updateInstall:[
  {label:"Firmware updates by manufacturer only",text:"To maintain device security and operational integrity, all firmware updates must be performed exclusively by authorized <MANUFACTURER> personnel. Customers are prohibited from installing firmware themselves."},

function boilerSelect(container,items,apply,has){

function repeat(container,list,factory,addLabel,mk){

const or=(v,ph)=>v&&v.trim()?esc(v):`<span class="empty">${ph}</span>`;

function crosswalk(reqs,part){
  return reqs.map(([ref,name])=>{
    const ps=M.pxx.filter(p=>(p.refs||"").split(",").map(x=>x.trim()).includes(ref)).map((p,i)=>"P"+String(M.pxx.indexOf(p)+1).padStart(2,"0"));
    const cs=part===1?M.cuxx.filter(c=>(c.refs||"").split(",").map(x=>x.trim()).includes(ref)).map(c=>"CU"+String(M.cuxx.indexOf(c)+1).padStart(2,"0")):[];
    const cells=[...ps.map(x=>`<span style="color:#2f7d5b;font-family:var(--mono);font-weight:600">${x}</span>`),...cs.map(x=>`<span style="color:#a9660f;font-family:var(--mono);font-weight:600">${x}</span>`)];
    return `<tr><td>${esc(name)}</td><td class="id"><span class="annexref">${ref}</span></td><td>${cells.length?cells.join(", "):'<span class="empty">—</span>'}</td></tr>`;

}

/* ---------- SBOM import (CycloneDX / SPDX) ---------- */
function importSbom(json){
  let comps=[];
  try{
    if(Array.isArray(json.components))comps=json.components.map(c=>({name:c.name,version:c.version}));
    else if(Array.isArray(json.packages))comps=json.packages.map(c=>({name:c.name,version:c.versionInfo}));
  }catch(e){}
  if(!comps.length){alert("No components found. Expected CycloneDX (.components[]) or SPDX (.packages[]).");return;}
  M.product.sub=comps.slice(0,40).map((c,i)=>({id:"",title:`${c.name}${c.version?" "+c.version:""}`}));
  const fmt=json.bomFormat||(json.spdxVersion?"SPDX":"SBOM");
  M.sbom.access=`SBOM available in ${esc(fmt)} format (${comps.length} components). ${M.sbom.access||"Access on request; see product portal."}`;
  buildForm();render();
  alert(`Imported ${comps.length} components from the SBOM into product sub-components and §9.`);
}
